[package]
name = "jfs"
version = "2.6.1"
edition = "2021"
description = "JFSecure's command line and MCP server: use secrets from the running JFSecure app without seeing them"
license = "MIT"
repository = "https://github.com/theone55/jfs"
homepage = "https://secure.jfolio.org/agents"

[dependencies]
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
strip = true
