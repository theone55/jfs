# Builds jfs for Windows, macOS (universal) and Linux, packs them into one MCP bundle (.mcpb), attaches it to the
# GitHub release of the tag and publishes the server to the official MCP Registry (io.github.theone55/jfs).
# Runs on a tag v* (the JFSecure release CI pushes one with each app release) or by hand for an existing tag.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build, e.g. v2.6.0'
        required: true

permissions:
  contents: write   # the release and its assets
  id-token: write   # GitHub OIDC login to the MCP Registry

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: windows-latest, platform: win32 }
          - { os: macos-latest, platform: darwin }
          - { os: ubuntu-latest, platform: linux }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.platform == 'linux' && 'x86_64-unknown-linux-musl' || '' }}
      - run: cargo test --locked
      - name: Build
        run: |
          mkdir -p out
          case "${{ matrix.platform }}" in
            win32)  cargo build --release --locked && cp target/release/jfs.exe out/ ;;
            darwin) cargo build --release --locked --target aarch64-apple-darwin
                    cargo build --release --locked --target x86_64-apple-darwin
                    lipo -create -output out/jfs target/aarch64-apple-darwin/release/jfs target/x86_64-apple-darwin/release/jfs ;;
            # static (musl): runs on any distro
            linux)  sudo apt-get install -y musl-tools >/dev/null
                    cargo build --release --locked --target x86_64-unknown-linux-musl
                    cp target/x86_64-unknown-linux-musl/release/jfs out/ ;;
          esac
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: jfs-${{ matrix.platform }}
          path: out/*
          retention-days: 3

  bundle:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # the packaging files (mcpb/, server.json) from main: an older tag may predate them; the code came from the tag
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          path: bin
      - name: Pack the .mcpb and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          V="${TAG#v}"
          echo "V=$V" >> "$GITHUB_ENV"
          # a published bundle is never replaced: the MCP Registry holds its SHA-256, and a version can't be
          # published twice there — a rerun for an old tag stops here
          if gh release view "$TAG" --json assets -q '.assets[].name' 2>/dev/null | grep -qx "jfs-$V.mcpb"; then
            echo "jfs-$V.mcpb is already on the release: nothing to do"; echo "DONE=1" >> "$GITHUB_ENV"; exit 0
          fi
          mkdir -p b/server/win32 b/server/darwin b/server/linux
          cp bin/jfs-win32/jfs.exe b/server/win32/
          cp bin/jfs-darwin/jfs b/server/darwin/ && chmod 755 b/server/darwin/jfs
          cp bin/jfs-linux/jfs b/server/linux/ && chmod 755 b/server/linux/jfs
          # the tools with their input schemas, asked from the built server itself (Smithery needs inputSchema)
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' | b/server/linux/jfs mcp | tail -1 \
            | jq '[.result.tools[] | {name, description, inputSchema}]' > tools.json
          jq --arg v "$V" --slurpfile t tools.json '.version = $v | .tools = $t[0]' mcpb/manifest.json > b/manifest.json
          jq -e '.tools | length >= 3' b/manifest.json >/dev/null
          cp LICENSE README.md b/
          (cd b && zip -qr -X "../jfs-$V.mcpb" .)
          SHA=$(sha256sum "jfs-$V.mcpb" | cut -d' ' -f1)
          echo "SHA=$SHA" >> "$GITHUB_ENV"; echo "V=$V" >> "$GITHUB_ENV"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "jfs $V" \
            --notes "jfs $V — the MCP server and command line of JFSecure $V. The .mcpb bundle (Windows, macOS universal, Linux) installs the MCP server in clients that take MCP bundles; it needs the JFSecure app running: https://secure.jfolio.org/agents"
          gh release upload "$TAG" "jfs-$V.mcpb"
      - name: Publish to the MCP Registry
        if: env.DONE != '1'
        run: |
          jq --arg v "$V" --arg sha "$SHA" \
            '.version = $v | .packages[0].identifier = "https://github.com/theone55/jfs/releases/download/v\($v)/jfs-\($v).mcpb" | .packages[0].fileSha256 = $sha' \
            server.json > server.out.json && mv server.out.json server.json
          cat server.json
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
      # Smithery (smithery.ai/server/jfolioalpha/jfsecure) takes the same bundle; SMITHERY_API_KEY = an API key
      # of the jfolioalpha account. Since 2026-10 Smithery answers 403 "Updating servers has been removed" to every
      # update, so a failure here only warns: the release and the MCP Registry are already done above.
      - name: Publish to Smithery
        if: env.DONE != '1'
        env:
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
        run: |
          [ -n "$SMITHERY_API_KEY" ] || { echo "::warning::no SMITHERY_API_KEY — publish jfs-$V.mcpb by hand"; exit 0; }
          npx -y @smithery/cli@4.11.1 mcp publish "./jfs-$V.mcpb" -n jfolioalpha/jfsecure \
            || echo "::warning::Smithery refused jfs-$V.mcpb (updates closed on their side) — the release is fine"
